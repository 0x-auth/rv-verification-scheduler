name: release
# Push a tag like v0.1.0 (or run manually) to publish to PyPI with the
# PYPI_API_TOKEN repo secret (the api-relay copies it in from the Cloudflare
# Secrets Store). Upload errors are surfaced as annotations.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build && twine check dist/*
      - name: upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          echo "::notice::token length ${#TWINE_PASSWORD}, starts with ${TWINE_PASSWORD:0:5}"
          twine upload --non-interactive --skip-existing --verbose dist/* > out.txt 2>&1 && { tail -3 out.txt; exit 0; }
          echo "::error::$(grep -iE 'error|forbidden|invalid|denied|HTTPError|too similar' out.txt | tail -5 | tr '\n' ' ')"
          exit 1
