name: release
# Push a tag like v0.1.0 to publish to PyPI.
# Uses the PYPI_API_TOKEN repo secret when present (the api-relay copies it in
# from the Cloudflare Secrets Store); without it, PyPI trusted publishing.
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
